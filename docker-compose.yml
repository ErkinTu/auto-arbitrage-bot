services:
  postgres:
    image: postgres:16-alpine
    container_name: car_analytics_postgres
    restart: unless-stopped
    env_file: .env
    ports:
      # bind только на localhost хоста: наружу порт БД не публикуется.
      # Для доступа в LAN/наружу осознанно задать POSTGRES_HOST=0.0.0.0 в .env.
      - "${POSTGRES_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Миграции схемы + сид источников/каталога/sync_targets — ОДИН раз за выкатку,
  # отдельным одноразовым контейнером. Раньше `init-db`/`seed` в своей команде
  # запускали api, worker и bot одновременно: их ALTER-ы толкались за
  # ACCESS EXCLUSIVE на `listings` (выкатка 21.10.2026 повисла), а параллельный
  # seed дублировал sync_targets (03.09.2026). Остальные сервисы ждут его
  # успешного завершения; упал — они не стартуют (лог: `docker compose logs migrate`).
  migrate:
    build: .
    container_name: car_analytics_migrate
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "uv run python -m app.cli init-db &&
             uv run python -m app.cli seed"

  api:
    build: .
    container_name: car_analytics_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # bind только на localhost хоста: локально API доступен полностью
      # (localhost:8000, /docs, Vite-прокси), а на сервере наружу не публикуется.
      # Открыть наружу осознанно: API_HOST=0.0.0.0 в .env.
      - "${API_HOST:-127.0.0.1}:8000:8000"
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    container_name: car_analytics_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uv run python -m app.worker

  bot:
    build: .
    container_name: car_analytics_bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Приватный RSA-ключ Finik — файлом в ./secrets/ (не значением в .env: не
    # утечёт в docker inspect). Подписывает исходящие запросы только бот; api
    # проверяет webhook публичным ключом Finik, который лежит в коде.
    # Монтируем КАТАЛОГ, а не файл: отсутствующий файл docker превратил бы в
    # каталог, и бот читал бы «ключ»-папку.
    volumes:
      - ./secrets:/run/secrets:ro
    command: uv run python -m app.bot

  # Публичный HTTPS-вход для webhook/redirect Finik. Пробрасывает наружу
  # ТОЛЬКО /api/v1/payments/* (см. Caddyfile); api остаётся на 127.0.0.1.
  # Профиль payments: локально НЕ стартует (docker compose up), на проде —
  # `docker compose --profile payments up -d`. Нужен PAYMENTS_DOMAIN в .env.
  caddy:
    image: caddy:2-alpine
    container_name: car_analytics_caddy
    restart: unless-stopped
    profiles: ["payments"]
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      PAYMENTS_DOMAIN: ${PAYMENTS_DOMAIN}
      # Домен админ-панели. Пусто — блок в Caddyfile просто не поднимется.
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Собранный фронт (pnpm build → dist/), залитый в admin-dist/. Каталога
      # может не быть — тогда панель отдаст 404, но платежи не пострадают.
      - ./admin-dist:/srv/admin:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
