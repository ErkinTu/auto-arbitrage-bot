services:
  postgres:
    image: postgres:16-alpine
    container_name: car_analytics_postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: car_analytics_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "uv run python -m app.cli init-db &&
             uv run python -m app.cli seed &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    container_name: car_analytics_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "uv run python -m app.cli init-db &&
             uv run python -m app.cli seed &&
             uv run python -m app.worker"

  bot:
    build: .
    container_name: car_analytics_bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "uv run python -m app.cli init-db &&
             uv run python -m app.cli seed &&
             uv run python -m app.bot"

volumes:
  postgres_data:
